api_and_agent_access:
  rest_api:
    gated_by_plan: true
    detail: >-
      "Mixmax API" appears in the pricing feature-comparison table and is included in Mixmax
      Suite. Meeting summary/transcript endpoints additionally require the workspace-level
      `mixmaxApi` feature flag, enabled by an admin.
  webhooks:
    gated_by_plan: true
    detail: Available on all paid plans (Inbox Copilot and above); excluded from Free.
  mcp_server:
    gated_by_plan: false
    detail: >-
      Mixmax states the MCP server is included at no additional cost for all customers with no
      plan restriction. The practical gate is data, not entitlement — meeting data requires
      Meeting Copilot. This makes MCP the cheapest agent-reachable surface Mixmax ships.
    source: https://success.mixmax.com/en/articles/14298142-mixmax-mcp-server

