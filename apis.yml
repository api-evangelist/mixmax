name: Mixmax
description: >-
  Mixmax is an AI-native sales engagement and execution platform that lives
  inside Gmail and Outlook, helping sales, customer success, recruiting, and
  other relationship-driven teams run their entire customer journey without
  context-switching. It combines email tracking and templates, multi-channel
  sequences, one-click scheduling, CRM automation, engagement signals, and
  Meeting Copilot summaries and transcripts. Mixmax exposes a public REST API
  (api.mixmax.com/v1) for lightweight real-time access to contacts, contact
  groups, sequences and recipients, file requests, meeting summaries and
  transcripts, and snippet tags, authenticated with an API token, plus message
  integrations and Sidebar/Widget SDKs for extending the product surface. Since
  April 2026 Mixmax also runs a first-party remote MCP server at
  mcp.mixmax.com/mcp — read-only, OAuth 2.0 with PKCE against its own OpenID
  Connect provider, scoped meetings:read — together with six installable Claude
  Skills, a rule-driven incoming and outgoing webhook surface with a documented
  event catalog, and published per-tier pricing.
