notes: >-
  Four real discovery documents are served, all of them belonging to the agent/OAuth surface
  rather than the classic REST surface: RFC 9728 protected-resource metadata and RFC 8414
  authorization-server metadata on the MCP host, and full OpenID Connect discovery on the
  app host. Nothing is served under /.well-known/ on the REST API host, the marketing site,
  or the developer portal — no security.txt, no api-catalog, no ai-plugin.json, and no A2A
  agent card on any host. Those are recorded absences, not fabrications.
  One defect worth reporting to Mixmax: the protected-resource metadata advertises
  resource_documentation https://docs.mixmax.com/mcp, and docs.mixmax.com does not resolve
  (NXDOMAIN). The live MCP documentation is at
  https://success.mixmax.com/en/articles/14298142-mixmax-mcp-server.
