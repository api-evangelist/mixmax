observations:
- >-
    No 5xx responses are documented anywhere in the reference. Every documented failure is a 4xx.
- >-
    The REST API's error envelope is a single prose string. Two different failures with the same
    status are indistinguishable to a client without string-matching the message, which is not a
    stable contract.
- >-
    Adopting RFC 9457 application/problem+json — or even just adding a stable `code` and a
    `request_id` to the existing envelope — would be the single cheapest correctness improvement
    to the REST surface.
