overlay: 1.0.0
info:
  title: API Evangelist enhancements for Mixmax REST API
  version: 1.0.0
extends: openapi/mixmax-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 3
      x-apievangelist-notes: >-
        Spec generated by API Evangelist from the documented Mixmax developer
        reference (developer.mixmax.com). Authentication, pagination, and
        rate-limit conventions verified against the docs; response bodies left
        open where Mixmax does not publish schemas.
  - target: $.info
    update:
      x-authentication: authentication/mixmax-authentication.yml
      x-conventions: conventions/mixmax-conventions.yml
      x-rate-limits: rate-limits/mixmax-rate-limits.yml
      x-lifecycle: lifecycle/mixmax-lifecycle.yml
      x-data-model: data-model/mixmax-data-model.yml
